<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abandoned But Not Forgotten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

<style>
  :root {
    --font: "Orbitron", "Segoe UI", Arial, sans-serif;
    /* EARTH TUNING:
       --earth-d      : how wide the visible Earth globe is. Bigger = bigger Earth.
       --earth-center : distance of Earth's centre below the top of the sky. Smaller = Earth sits higher. */
    --earth-d: 125vw;
    --earth-center: calc(50% + 62.5vw);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    font-family: var(--font); color:#eaf2ff;
    background-color:#000;
    /* Background image: file must be in the same GitHub repo (name is case-sensitive) */
    background-image: linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.12)),
      url("https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/StarBackground.png");
    background-size: cover; background-position: center; background-attachment: fixed;
    /* fit exactly one screen: no scrolling, no empty space at the bottom */
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }

  /* ---------- header: darker, translucent band ---------- */
  header {
    flex:0 0 auto; position:relative; z-index:3; text-align:center; padding:22px 16px 18px;
    background: rgba(3,5,14,.62);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(140,180,255,.25);
    box-shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  header h1 {
    margin:0; font-weight:700; text-transform:uppercase;
    font-size:clamp(18px,3.6vw,44px); letter-spacing:.14em;
  }
  header p { margin:8px 0 0; font-weight:500; font-size:clamp(11px,1.5vw,17px); letter-spacing:.12em; opacity:.8; }

  /* ---------- the sky ---------- */
  .space { position:relative; z-index:1; flex:1 1 auto; min-height:0; }

  /* Earth: huge, cropped by the bottom-left corner, like the sketch */
  .earth-wrap { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #earth {
    position:absolute; margin:0;
    width: var(--earth-d); aspect-ratio:1 / 1;
    left: 7.5vw;                      /* centre of Earth, from the left edge */
    top: var(--earth-center);
    transform: translate(-50%,-50%);
  }
  #earth model-viewer {
    position:absolute; left:50%; top:50%;
    width: calc(var(--earth-d) / 1.232); height: calc(var(--earth-d) / 1.232);
    transform: translate(-50%,-50%) scale(1.4);
    /* GLOW TUNING (Earth): follows the globe's real edge. Last number = strength (0 to 1). */
    filter: drop-shadow(0 0 14px rgba(70,140,255,.4));
  }
  #earth-label {
    position:absolute; left:10%; top:84%; z-index:2; margin:0;
    font-size:clamp(14px,1.8vw,26px); letter-spacing:.14em;
  }

  /* the small worlds: left/top are the CENTRE of each world (from the sketch) */
  .body { position:absolute; margin:0; text-align:center; transform:translate(-50%,-50%); z-index:2; }
  .body figcaption { margin-top:2px; font-size:clamp(10px,1.1vw,16px); letter-spacing:.12em; }

  /* sizes: Earth > Mars > Moon > Ceres > Eros (not to scale, but in the right order) */
  /* each width is the viewer box; the planet fills ~88% of it (set by the script below) */
  #eros  { left:59%;   top:12%; width:clamp(65px,8vw,150px); }
  #ceres { left:80.5%; top:17%; width:clamp(66px,6.8vw,136px); }
  #moon  { left:39%; top:27%; width:clamp(120px,13vw,260px); }
  #mars  { left:80%;   top:62%; width:clamp(190px,20vw,400px); }

  /* ---------- the 3D models ---------- */
  model-viewer {
    width:100%; height:auto; aspect-ratio:1 / 1; display:block;   /* height:auto makes the box truly square */
    background:transparent; --poster-color:transparent;
    transition: transform .3s ease, filter .3s ease;
    /* GLOW TUNING (resting glow): the first number is the blur, the last is the strength (0 to 1) */
    filter: drop-shadow(0 0 6px rgba(255,255,255,.3));
  }

  /* clickable worlds: stronger glow + grow on hover or keyboard focus */
  .clickable { cursor:pointer; }
  .clickable model-viewer { cursor:pointer; }
  .clickable:hover model-viewer, .clickable:focus-within model-viewer {
    transform: scale(1.15); filter: drop-shadow(0 0 26px rgba(255,255,255,.95));
  }
  .clickable:focus-visible { outline:2px solid #8fb8ff; outline-offset:6px; border-radius:8px; }
  /* Mars glows reddish-orange */
  #mars model-viewer { filter: drop-shadow(0 0 6px rgba(255,122,60,.35)); }
  #mars:hover model-viewer, #mars:focus-within model-viewer { filter: drop-shadow(0 0 26px rgba(255,122,60,1)); }
  /* Earth is not clickable: it keeps its own blue glow from the #earth rule above */

  #hint:empty { display:none; }
  #hint { position:relative; z-index:3; text-align:center; padding:8px 16px 28px; font-size:clamp(11px,1.4vw,16px); letter-spacing:.1em; opacity:.85; }

  /* phones: stack the worlds in a column, Earth as a cropped dome at the bottom */
  @media (max-width:700px) {
    body { height:auto; overflow:auto; display:block; }   /* phones: stacked layout scrolls */
    .space { height:auto; display:flex; flex-direction:column; align-items:center; gap:18px; padding:20px 0 60vw; overflow:hidden; }
    .body { position:static; transform:none; }
    #eros  { width:30vw; }
    #ceres { width:34vw; }
    #moon  { width:52vw; }
    #mars  { width:70vw; }
    :root { --earth-d: 150vw; --earth-center: calc(100% + 20vw); }
    #earth { left:50vw; }
    #earth-label { left:50%; top:auto; bottom:12vw; transform:translateX(-50%); }
  }
  /* ---------- postcard popup ---------- */
  #postcard-overlay { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(3,5,15,.8); opacity:0; visibility:hidden; transition:opacity .25s, visibility .25s; }
  #postcard-overlay.open { opacity:1; visibility:visible; }
  .pc-wrap { width:min(900px,100%); display:flex; flex-direction:column; align-items:center; gap:16px;
    transform:translateY(24px) scale(.96); transition:transform .3s ease; }
  #postcard-overlay.open .pc-wrap { transform:none; }
  .postcard { position:relative; width:100%; aspect-ratio:1057 / 693; box-shadow:0 14px 50px #000;
    color:#583326; font-family:"Gaegu","Comic Sans MS",cursive; --fs:30px; }
  .pc-bg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pc-line { position:absolute; left:8.3%; max-width:38%; font-size:var(--fs); line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pc-location { top:8.4%; }  #pc-planet { top:14.6%; }  #pc-date { top:20.9%; }
  .pc-pic { position:absolute; left:11.5%; top:46.6%; width:27.9%; height:42.7%; display:flex; align-items:center; justify-content:center; }
  .pc-pic img { max-width:100%; max-height:100%; object-fit:contain; }
  .pc-pic.empty { border:2px dashed rgba(88,51,38,.35); font-size:calc(var(--fs) * .6); text-align:center; opacity:.7; }
  .pc-msg { position:absolute; left:51.5%; top:33.9%; width:43.5%; height:44%; overflow:hidden; font-size:var(--fs); line-height:1.25; white-space:pre-line; }
  .pc-name { position:absolute; left:56.8%; top:81.5%; max-width:39%; font-size:var(--fs); line-height:1.1; white-space:nowrap; overflow:hidden; }
  #pc-done { font:700 20px "Gaegu","Comic Sans MS",cursive; color:#583326; background:#f6ecd6; border:2px solid #583326;
    border-radius:6px; padding:8px 26px; cursor:pointer; }
  #pc-done:hover, #pc-done:focus-visible { background:#fff8e6; outline:3px solid #fff; }
</style>
</head>
<body>

<header>
  <h1>Abandoned but not forgotten</h1>
  <p>They finished their missions. Earth is still listening.</p>
</header>

<main class="space">
  <!-- Earth sits behind everything, cropped by the bottom-left corner -->
  <div class="earth-wrap">
    <figure id="earth">
      <model-viewer alt="A slowly spinning model of Earth" src="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/Earth_1_12756.glb"
        data-fit="0.88" auto-rotate rotation-per-second="1.5deg" interaction-prompt="none" disable-zoom disable-pan environment-image="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/SunLight.png" exposure="6.4"></model-viewer>
    </figure>
  </div>
  <p id="earth-label">Earth</p>

  <!-- File names must match the repo exactly (case-sensitive). Change @main if your branch has another name. -->
  <figure class="body clickable" id="eros"  data-world="eros"  tabindex="0" role="button" aria-label="Eros. Open a postcard.">
    <model-viewer alt="A spinning model of the asteroid Eros" src="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/Eros_1_10.glb"
      auto-rotate rotation-per-second="7deg" interaction-prompt="none" disable-zoom disable-pan environment-image="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/SunLight.png" exposure="4.4"></model-viewer>
    <figcaption>Eros</figcaption>
  </figure>

  <figure class="body clickable" id="ceres" data-world="ceres" tabindex="0" role="button" aria-label="Ceres. Open a postcard.">
    <model-viewer alt="A spinning model of the dwarf planet Ceres" src="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/Ceres_1_1000.glb" data-fit="0.85"
      auto-rotate rotation-per-second="4.25deg" interaction-prompt="none" disable-zoom disable-pan environment-image="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/SunLight.png" exposure="4.1"></model-viewer>
    <figcaption>Ceres</figcaption>
  </figure>

  <figure class="body clickable" id="moon"  data-world="moon"  tabindex="0" role="button" aria-label="The Moon. Open a postcard.">
    <model-viewer alt="A spinning model of the Moon" src="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/moon_small.glb" data-fit="0.88"
      auto-rotate rotation-per-second="2.25deg" interaction-prompt="none" disable-zoom disable-pan environment-image="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/SunLight.png" exposure="4.7"></model-viewer>
    <figcaption>The Moon</figcaption>
  </figure>

  <figure class="body clickable" id="mars"  data-world="mars"  tabindex="0" role="button" aria-label="Mars. Open a postcard.">
    <model-viewer alt="A spinning model of Mars" src="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/24881_Mars_1_6792.glb" data-fit="0.88"
      auto-rotate rotation-per-second="3.25deg" interaction-prompt="none" disable-zoom disable-pan environment-image="https://cdn.jsdelivr.net/gh/aagneyashrivastav/nasa3dmodels@main/SunLight.png" exposure="5.1"></model-viewer>
    <figcaption>Mars</figcaption>
  </figure>
</main>

<div id="hint" aria-live="polite"></div>

<div id="postcard-overlay" role="dialog" aria-modal="true" aria-label="Postcard" aria-hidden="true">
  <div class="pc-wrap">
    <div class="postcard" id="postcard">
      <img class="pc-bg" src="postcard-blank.jpg" alt="">
      <div class="pc-line" id="pc-location"></div>
      <div class="pc-line" id="pc-planet"></div>
      <div class="pc-line" id="pc-date"></div>
      <div class="pc-pic" id="pc-pic"><img id="pc-img" alt=""></div>
      <div class="pc-msg" id="pc-msg"></div>
      <div class="pc-name" id="pc-name"></div>
    </div>
    <button id="pc-done" type="button">Done reading</button>
  </div>
</div>


<script>
  // ---------- reduced motion: stop the spin ----------
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('model-viewer').forEach(m => m.removeAttribute('auto-rotate'));
  }

  // ---------- fit each sphere to its box ----------
  // Works out the camera distance so the planet fills data-fit (e.g. 0.88) of the viewer box.
  document.querySelectorAll('model-viewer[data-fit]').forEach(m => {
    m.addEventListener('load', () => {
      const fill = parseFloat(m.dataset.fit) || 0.88;
      const dim = m.getDimensions();
      const R = Math.max(dim.x, dim.y, dim.z) / 2;
      const fov = (m.getFieldOfView ? m.getFieldOfView() : 45) * Math.PI / 180;
      const d = R / Math.sin(Math.atan(fill * Math.tan(fov / 2)));
      m.minCameraOrbit = 'auto auto ' + (d * 0.5) + 'm';
      m.cameraOrbit = '0deg 80deg ' + d + 'm';
    });
  });

  // ---------- load problems: fall back to plain lighting and tell us what failed ----------
  document.querySelectorAll('model-viewer').forEach(m => {
    m.addEventListener('error', e => {
      console.error('Model problem:', m.alt, e.detail);
      if (m.getAttribute('environment-image') !== 'neutral') m.setAttribute('environment-image', 'neutral');
    });
  });

  // ---------- postcards: settings you may edit ----------
  // The spreadsheet, saved as CSV. Tried in this order (first one that loads wins).
  const CSV_URLS = [
    'postcards.csv',
    'https://raw.githubusercontent.com/aagneyashrivastav/nasa3dmodels/main/postcards.csv'
  ];
  // First number in a card id -> which world's stack the card belongs to.
  const WORLD_CODES = { moon: '1', mars: '2', ceres: '3', eros: '4' };
  // Machine drawings live here, named <world>-<machine>.png (card id 1-2-3 uses images/1-2.png).
  const IMAGE_DIR = 'images/';

  // ---------- postcards: reading the spreadsheet ----------
  function parseCSV(text) {
    const rows = []; let row = [], cur = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else quoted = false; }
        else cur += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }
  function toCards(rows) {
    return rows.map(r => ({
      id: (r[0] || '').trim(), location: (r[1] || '').trim(), planet: (r[2] || '').trim(),
      date: (r[3] || '').trim(), name: (r[4] || '').trim(), message: (r[5] || '').trim(), image: (r[6] || '').trim()
    })).filter(c => /^\d/.test(c.id));          // rows whose id does not start with a number (like the header) are skipped
  }
  function parseId(id) {                          // "1-2-3" or "123" -> world 1, machine 2, card 3
    if (/[-._ ]/.test(id)) { const p = id.split(/[-._ ]+/); return { world: p[0], machine: p[1] || '', n: p[2] || '' }; }
    return { world: id[0], machine: id[1] || '', n: id.slice(2) };
  }
  let CARDS = null;
  async function loadCards() {
    for (const url of CSV_URLS) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        if (!r.ok) continue;
        const cards = toCards(parseCSV((await r.text()).replace(/^\uFEFF/, '')));
        if (cards.length) return cards;
      } catch (e) { /* try the next address */ }
    }
    return [];
  }
  loadCards().then(c => { CARDS = c; });

  // ---------- postcards: choosing a card ----------
  const shown = {};                               // per world: cards already shown this visit
  function pickCard(world) {
    const stack = CARDS.filter(c => parseId(c.id).world === WORLD_CODES[world]);
    if (!stack.length) return null;
    let pool = stack.filter(c => !(shown[world] || []).includes(c.id));
    if (!pool.length) { shown[world] = []; pool = stack; }       // every card seen: start over
    const card = pool[Math.floor(Math.random() * pool.length)];
    (shown[world] = shown[world] || []).push(card.id);
    return card;
  }

  // ---------- postcards: showing the popup ----------
  const $ = id => document.getElementById(id);
  const overlay = $('postcard-overlay');
  let lastFocus = null;

  function fit(el, startPx, minPx) {                // shrink text until it fits its box
    let size = startPx; el.style.fontSize = size + 'px';
    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > minPx) {
      size -= 0.5; el.style.fontSize = size + 'px';
    }
  }
  function fitAll() {
    const base = $('postcard').clientWidth * 0.031;
    $('postcard').style.setProperty('--fs', base + 'px');
    fit($('pc-msg'), base, 8);
    fit($('pc-name'), base, 8);
  }
  function showCard(c) {
    const p = parseId(c.id);
    $('pc-location').textContent = c.location;
    $('pc-planet').textContent = c.planet;
    $('pc-date').textContent = c.date;
    $('pc-msg').textContent = c.message;
    $('pc-name').textContent = '\u2013 ' + c.name;
    const pic = $('pc-pic'), img = $('pc-img');
    pic.classList.remove('empty'); pic.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });
    img.style.display = '';
    img.alt = 'Hand-drawn sketch of ' + c.name;
    img.onerror = () => { img.style.display = 'none'; pic.classList.add('empty'); pic.append('sketch coming soon'); };
    img.src = c.image || (IMAGE_DIR + p.world + '-' + p.machine + '.png');
    lastFocus = document.activeElement;
    overlay.classList.add('open'); overlay.setAttribute('aria-hidden', 'false');
    fitAll();
    $('pc-done').focus();
  }
  function closeCard() {
    overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true');
    if (lastFocus) lastFocus.focus();
  }
  async function openWorld(world) {
    if (CARDS === null) CARDS = await loadCards();
    const card = CARDS.length ? pickCard(world) : null;
    if (!card) {
      $('hint').textContent = CARDS.length ? 'No postcards for this world yet.' : 'Could not load the postcards file (postcards.csv).';
      return;
    }
    showCard(card);
  }
  $('pc-done').addEventListener('click', closeCard);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeCard(); });
  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') closeCard();
    if (e.key === 'Tab') { e.preventDefault(); $('pc-done').focus(); }
  });
  window.addEventListener('resize', () => { if (overlay.classList.contains('open')) fitAll(); });

  document.querySelectorAll('.clickable').forEach(el => {
    el.addEventListener('click', () => openWorld(el.dataset.world));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openWorld(el.dataset.world); } });
  });
</script>
</body>
</html>
